   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #203a4c" transform="translate(134.644713 76.116215)">Chosen score falls: −37.761 nat</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #203a4c" transform="translate(132.099088 85.074465)">Rejected score falls: −59.936 nat</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #203a4c" transform="translate(139.885338 147.897335)">96 / 100 final logged updates</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #203a4c" transform="translate(111.784713 156.855585)">Both scores below the frozen SFT reference</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #203a4c" transform="translate(336.376107 79.13661)">A larger relative margin</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #203a4c" transform="translate(344.328607 88.09486)">can lower DPO loss.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #203a4c" transform="translate(336.314232 97.05311)">It does not certify facts.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #667680" transform="translate(97.206221 199.606568)">Measured: mean sequence-log-probability changes in the last 100 updates.</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #667680" transform="translate(100.024815 207.445037)">Illustrative robot; no claim that total log-probability is an accuracy metric.</text>
