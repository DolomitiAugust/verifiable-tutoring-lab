   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a4c" x="18.001134" y="20.040633" transform="rotate(-0 18.001134 20.040633)">The optimizer can win its comparison while both answers lose probability</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #203a4c" transform="translate(34.912411 148.039312)">Optimizer</text>
