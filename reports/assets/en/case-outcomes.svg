   <g id="text_1">
    <text style="font-weight: 700; font-size: 11.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #263746" x="229.606299" y="16.823128" transform="rotate(-0 229.606299 16.823128)">Four cases against their frozen expectations</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #62727c" x="229.606299" y="33.406363" transform="rotate(-0 229.606299 33.406363)">Expected task completion → observed completion; historical results retained</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.35px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #263746" x="117.099213" y="60.11524" transform="rotate(-0 117.099213 60.11524)">C03  Across-instance memory</text>
   </g>
   <g id="text_4">
